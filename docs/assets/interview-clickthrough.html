  </style>
  <header class="yp-top"><strong class="yp-brand">YAW</strong><span>Project setup / Interview</span><span class="yp-label">Temporary preview</span></header>
  <div class="yp-layout">

    <main class="yp-main">

      <div class="yp-foot"><button type="button" class="cursor-interaction" data-back>← Back</button><button type="button" class="yp-primary cursor-interaction" data-next>Continue →</button></div>
      <section class="yp-tree" aria-label="Project structure"><div class="yp-tree-title"><h2><i data-lucide="folder-tree" aria-hidden="true"></i>Project structure</h2><span class="yp-label" data-file-count></span><button type="button" class="cursor-interaction" data-tree-toggle aria-expanded="true" aria-label="Collapse project structure">⌃</button></div><ul class="yp-files" aria-label="Planned project files"></ul></section>

  </div>
  <script>
    (() => {
      const root = document.getElementById('yaw-interview-preview');

      state.step = Math.max(0, Math.min(5, Number(state.step) || 0));
      const names = ['Starting point','About you','Purpose/Idea','Architecture','Collaboration','Review & apply'];
      const pane = root.querySelector('.yp-pane'), detail = root.querySelector('.yp-detail'), filesNode = root.querySelector('.yp-files');
      let focused = '', changed = '', lastPaths = new Set();
      const icons = () => globalThis.lucide?.createIcons({ attrs: { width: 17, height: 17 } });
      const el = (tag,text,cls) => { const node = document.createElement(tag); if(text !== undefined) node.textContent = text; if(cls) node.className = cls; return node; };

      function showDetail(label,text,key='') { focused=key; detail.replaceChildren(title(label,'book-open')); for(const sentence of text.split('\n')) { const p=el('p'); sentence.split(/(`[^`]+`)/g).forEach(part=>p.append(part.startsWith('`')?el('code',part.slice(1,-1)):document.createTextNode(part))); detail.append(p); } drawFiles(); icons(); }

      const defaults = [
        ['Interview depth','Can always be changed',''],
        ['About you','Creates one `AGENTS.md` as the global entry point for all agents, referring to individual agent files within the project.','agent'],
        ['Purpose/Idea','Describe what your app does, its target users and its constraints.\nWill be stored as a global entry in `AGENTS.md`.','purpose'],
        ['Architecture','Environment tools: `node>=22.13`, `just`.\nAgent instructions: `AGENTS.md` and `docs/engineering.md`.','language'],
        ['Collaboration','Choose project rules and review sub-agents.',''],
        ['Review & apply','Save draft: Continue later.\nSave preset: Save for future use.','']
      ];
      function fileList() { const files=[['AGENTS.md','agent purpose'],[state.agent==='Gemini CLI'?'GEMINI.md':state.agent==='Codex'?'.agents/skills/':state.agent==='Copilot'?'.github/copilot-instructions.md':'CLAUDE.md','agent'],['.yaw/answers.yaml',''],['.yaw/manifest.json',''],['docs/engineering.md','unit docker wrapper language destination'],['justfile','wrapper language'],['just/node-cli.just','language destination'],['package.json','language']]; if(state.wrapper==='Shell') files.push(['project.sh','wrapper']); if(state.wrapper==='Make') files.push(['Makefile','wrapper']); if(state.map) files.push(['docs/code-map.md','map']); if(state.decisions) files.push(['.decisions/','decisions']); if(state.reviews) files.push(['just/review.just','reviews quality gate'],['.claude/agents/review-quality.md','reviews quality gate']); return files; }
      function drawFiles() { const list=fileList(); filesNode.replaceChildren(); for(const [path,keys] of list) { const li=el('li'); li.append(icon(path.endsWith('/')?'folder':'file'),el('code',path)); const section=state.step===1?'agent':state.step===2?'purpose':state.step===3?'language destination wrapper docker':state.step===4?'unit reviews quality gate map decisions':''; li.dataset.section=String(Boolean(section&&keys.split(' ').some(key=>key&&section.includes(key)))); li.dataset.focus=String(Boolean(focused&&keys.split(' ').includes(focused))); li.dataset.changed=String(Boolean(changed&&(keys.split(' ').includes(changed)||lastPaths.size&&!lastPaths.has(path)))); filesNode.append(li); } lastPaths=new Set(list.map(item=>item[0])); root.querySelector('[data-file-count]').textContent=`${list.length} files`; filesNode.hidden=!state.tree; icons(); }
      function render() {
        root.querySelector('.yp-nav').replaceChildren(...names.map((name,index)=>{const b=el('button',undefined,'cursor-interaction');b.type='button';b.append(el('span',String(index+1).padStart(2,'0'),'yp-step-no'),document.createTextNode(name));if(index===state.step)b.setAttribute('aria-current','step');b.addEventListener('click',()=>{state.step=index;focused='';changed='';render();save();});return b;}));
        pane.classList.toggle('yp-compact',state.compact);pane.replaceChildren();
        if(state.step===0) {
          pane.append(title('Interview depth','sliders-horizontal'),choices('depth',['Quick','Basic','All'],'Interview depth','Quick: MVP and prototype. Default LLM communication settings apply.\nBasic: Quick plus collaboration and review gates.\nAll: Basic plus advanced features.'),el('p','Can always be changed','yp-hint'),title('Presets','layers'));
          const grid=el('div',undefined,'yp-grid'); for(const [key,label,meta,summary] of [['new','New setup','From global defaults','If this is your first initialization, the general settings apply as defaults.'],['tracker','Reading tracker','30 Oct 2026 · Computer · TypeScript','A reading tracker for book clubs with private notes.'],['api','Notes API','28 Oct 2026 · Serverless · Python','A private notes API for a small team.']]) {const b=el('button',undefined,'yp-choice cursor-interaction');b.type='button';b.setAttribute('aria-pressed',String(state.preset===key));b.append(icon(key==='new'?'file-plus':'layers'),el('strong',label),el('small',meta),el('small',summary));b.addEventListener('click',()=>{state.preset=key;if(key==='api'){state.language='Python';state.destination='Serverless';state.purpose='A private notes API for a small team.';}else if(key==='tracker'){state.language='TypeScript';state.destination='Computer';}render();save();});grid.append(b);}pane.append(grid);
        } else if(state.step===1) {
          pane.append(title('About you','users'),choices('agent',['Claude Code','Codex','Copilot','Gemini CLI'],'About you',defaults[1][1]));
          if(state.agent==='Codex'){const box=el('div',undefined,'yp-support');const p=el('p');p.append('Trust hooks once via ',el('code','/hooks'),'; ',el('code','yaw doctor'),' reminds you.');const p2=el('p');p2.append('Telemetry is partially supported via ',el('code','~/.codex/config.toml'),' only.');box.append(p,p2);pane.append(box);}else if(['Copilot','Gemini CLI'].includes(state.agent))pane.append(el('p','Some telemetry and hook features are unsupported.','yp-support'));
          pane.append(title('Communication style','messages-square'),el('p','From global defaults','yp-hint'),choices('tone',['Concise','Balanced','Detailed'],'Communication style','Default settings for LLM communication styles apply.'));
        } else if(state.step===2) {
          pane.append(title('Purpose/Idea','lightbulb'),el('p','Include the intended users, their main task, and important data or interface constraints.','yp-hint'));
          const area=el('textarea');area.value=state.purpose;area.setAttribute('aria-label','Purpose/Idea');const count=el('p',`${state.purpose.trim().split(/\s+/).length} / 500 words`,'yp-hint');area.addEventListener('input',()=>{state.purpose=area.value;const words=area.value.trim().split(/\s+/).filter(Boolean).length;count.textContent=`${words} / 500 words`;area.setCustomValidity(words>500?'Use at most 500 words.':'');changed='purpose';drawFiles();save();});pane.append(bind(area,'purpose','Purpose/Idea',defaults[2][1]),count);
          const llm=el('details'),support=el('button','Copy prompt','cursor-interaction');support.type='button';support.addEventListener('click',()=>{root.querySelector('[data-status]').textContent='Preview only · LLM support prompt selected';});llm.append(el('summary','LLM Support'),el('p','Use any LLM to support you with project decisions.'),support);pane.append(llm);
        } else if(state.step===3) {
          pane.append(title('Language','code'),choices('language',['TypeScript','Python','PHP','Go'],'Language',defaults[3][1]),title('Destination','server'),choices('destination',['Computer','Server','Serverless','Edge / CDN','Static hosting'],'Destination',defaults[3][1]),title('Architecture','blocks'));
          if(['Computer','Server','Serverless'].includes(state.destination))pane.append(check('docker','Support Docker','Tells the agent to set up Docker support.'));
          pane.append(el('h3','Wrapper'),choices('wrapper',['Off','Shell','Just','Make'],'Wrapper','Tells the agent to add a wrapper script for common commands like installing, running and checking the project.'),el('div',undefined,'yp-summary'));
          const stack=pane.lastElementChild;stack.append(title(`Your stack: ${state.language} · ${state.destination}`,'package'),el('code',state.language==='Python'?'python>=3.12 · uv · just':'node>=22.13 · just'));
        } else if(state.step===4) {
          const head=el('div',undefined,'yp-heading');head.append(title('Collaboration','users'),check('compact','Compact','Show concise controls.'));pane.append(head,title('Coding Style','ruler'));
          const grid=el('div',undefined,'yp-grid yp-single'),unit=el('article',undefined,'yp-feature');unit.append(check('unit','Unit Tests','Require a meaningful, non-empty suite in checks and Quality reviews.'),el('p','Quality follows this setting.','yp-hint'));grid.append(unit);pane.append(grid,title('Coding Practices','code'),choices('logs',['Console','Files','Both'],'Diagnostic logs','Use structured logs with redaction and bounded retention.'),title('Advanced Coding Rules','notebook-pen'));
          const advanced=el('div',undefined,'yp-grid');for(const [key,label] of [['map','Code map'],['decisions','Decision journal']]){const box=el('article',undefined,'yp-feature');box.append(check(key,label,`Add ${label.toLowerCase()} to the project.`));advanced.append(box);}pane.append(advanced,title('Review Sub-Agents','shield-check'),check('reviews','Review agents','Read-only reviewers. Quality follows the Unit Tests setting.'));
          const rg=el('div',undefined,'yp-grid'),quality=el('article',undefined,'yp-feature'),gate=el('article',undefined,'yp-feature');quality.append(el('h3','Quality'),choices('quality',['Off','On request','Before push'],'Quality',state.unit?'An empty or failing unit-test suite is a finding.':'A unit-test suite is optional.'));gate.append(el('h3','Push gate'),choices('gate',['Warn','Block'],'Push gate','Warn asks before pushing with findings. Block stops the push.'));quality.querySelectorAll('button').forEach(button=>button.disabled=!state.reviews);gate.querySelectorAll('button').forEach(button=>button.disabled=!state.reviews||state.quality!=='Before push');rg.append(quality,gate);pane.append(rg,title('Coding Assistance','bell'),el('p','Notifications · local helpers','yp-hint'));
        } else {
          pane.append(title('Review & apply','clipboard-check'));for(const [label,value] of [['Purpose',state.purpose],['Architecture',`${state.language} · ${state.destination}`],['Wrapper',state.wrapper],['Unit Tests',state.unit?'Required':'Optional'],['Review agents',state.reviews?'Enabled':'Off']]){const row=el('div',undefined,'yp-summary');row.append(el('strong',label),el('p',value,'yp-hint'));pane.append(row);}for(const [label,hint] of [['Save draft','Continue later'],['Save preset','Save for future use']]){const row=el('div',undefined,'yp-save'),b=el('button',label,'cursor-interaction');b.type='button';b.addEventListener('click',()=>{root.querySelector('[data-status]').textContent=`Preview only · ${label} selected`;});row.append(b,el('span',hint,'yp-hint'));pane.append(bind(row,'',label,hint));}pane.append(title('Create project foundations','files'),el('p','Task your agent to create Architecture, Data Model and UI/UX documents for project setup, documentation and workflow guidance.','yp-hint'));const b=el('button','Copy prompt','cursor-interaction');b.type='button';b.addEventListener('click',()=>{root.querySelector('[data-status]').textContent='Preview only · Foundation prompt selected';});pane.append(b);
        }
        root.querySelector('[data-back]').disabled=state.step===0;root.querySelector('[data-next]').textContent=state.step===5?'Apply preview':'Continue →';showDetail(...defaults[state.step]);drawFiles();icons();
      }
      root.querySelector('[data-back]').addEventListener('click',()=>{if(state.step>0)state.step--;focused='';render();save();});
      root.querySelector('[data-next]').addEventListener('click',()=>{const area=pane.querySelector('textarea');if(area&&!area.reportValidity())return;if(state.step<5){state.step++;focused='';changed='';render();save();}else root.querySelector('[data-status]').textContent='Preview only · No project files written.';});
      root.querySelector('[data-tree-toggle]').addEventListener('click',()=>{state.tree=!state.tree;const button=root.querySelector('[data-tree-toggle]');button.setAttribute('aria-expanded',String(state.tree));button.setAttribute('aria-label',`${state.tree?'Collapse':'Expand'} project structure`);button.textContent=state.tree?'⌃':'⌄';drawFiles();save();});

    })();
  </script>
