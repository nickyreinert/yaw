# Kit CI (Y-2.2, ADR-0008, ADR-0014): kit tests on Node 22.13 (floor) and 24, macOS and Linux;
# install.sh end-to-end in a Debian container; shellcheck on every shell script; schema examples validate.
name: kit-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is paused: too slow on GitHub. Re-enable macOS before the v0.1 release (issue #116).
        os: [ubuntu-latest]
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      - name: lefthook and gitleaks (git-hooks module tests, ADR-0026)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install lefthook gitleaks
          else
            mkdir -p "$HOME/bin"
            gh release download v8.30.1 -R gitleaks/gitleaks -p 'gitleaks_8.30.1_linux_x64.tar.gz' -O /tmp/gitleaks.tgz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
            tar xz -C "$HOME/bin" -f /tmp/gitleaks.tgz gitleaks
            gh release download v2.2.2 -R evilmartians/lefthook -p 'lefthook_2.2.2_Linux_x86_64' -O /tmp/lefthook
            echo "4fbf89eb7748c6aed84d833ee1a29edac48fae614468ca9a82896ec32f2800b6  /tmp/lefthook" | sha256sum -c -
            install -m 755 /tmp/lefthook "$HOME/bin/lefthook"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - run: node --version
      - run: just --version && uv --version
      - run: npm test
      - run: npm run validate

  profile:
    # Profile matrix (Y-6): yaw init (runs just setup and just check) on examples/<profile>/answers.yaml.
    name: profile ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [static-site, python-web, node-ts-vercel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: yaw init and just check
        run: |
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          node "$GITHUB_WORKSPACE/bin/yaw" init --answers "$GITHUB_WORKSPACE/examples/${{ matrix.profile }}/answers.yaml" --yes

  install-in-container:
    # install.sh end-to-end on a clean Debian image (Y-2.3), Node at the floor.
    runs-on: ubuntu-latest
    container: node:22.13-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node --test test/install.test.js

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - name: shellcheck every shell script
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
