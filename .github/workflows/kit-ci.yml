# Kit CI (Y-2.2, ADR-0008, ADR-0014): kit tests on Node 22.13 (floor) and 24, macOS and Linux;
# install.sh end-to-end in a Debian container; shellcheck on every shell script; schema examples validate.
name: kit-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      - name: lefthook and gitleaks (git-hooks module tests, ADR-0026)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install lefthook gitleaks
          else
            mkdir -p "$HOME/bin"
            gh release download v8.30.1 -R gitleaks/gitleaks -p 'gitleaks_8.30.1_linux_x64.tar.gz' -O - | tar xz -C "$HOME/bin" gitleaks
            gh release download v2.2.2 -R evilmartians/lefthook -p 'lefthook_2.2.2_Linux_x86_64' -O "$HOME/bin/lefthook"
            chmod +x "$HOME/bin/lefthook"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - run: node --version
      - run: just --version && uv --version
      - run: npm test
      - run: npm run validate

  install-in-container:
    # install.sh end-to-end on a clean Debian image (Y-2.3), Node at the floor.
    runs-on: ubuntu-latest
    container: node:22.13-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node --test test/install.test.js

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - name: shellcheck every shell script
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
