# interview/base.yaml: questions every setup asks (doc 02 §3, doc 03, ADR-0017).
# Step 3 holds the Quick subset (mode Q) that a built module or the profile suggestion uses.
# Modules add theirs in module.yaml#questions; more questions of doc 03 follow with their modules (step 5, 7).
questions:
  - id: user.agents
    ref: "0.0"
    scope: user
    mode: Q
    type: multi
    label: "Agents: Which coding agents should this setup support? (comma-separated)"
    help: agents
    choices:
      - { value: claude, label: Claude Code }
      - { value: codex, label: Codex }
      - { value: copilot, label: Copilot }
      - { value: gemini, label: Gemini CLI }
    default: [claude]
  - id: user.expertise
    ref: "0.1"
    scope: user
    mode: Q
    type: choice
    label: "Experience: Your experience with software development?"
    help: expertise
    choices: [layperson, intermediate, expert]
    default: intermediate
  - id: user.language
    ref: "0.2"
    scope: user
    mode: Q
    type: text
    label: "Chat: Language for chat with the agent?"
    default: de
  - id: user.autonomy
    ref: "0.7"
    scope: user
    mode: Q
    type: choice
    label: "Frequency: How often should the agent ask before acting?"
    help: autonomy
    choices:
      - { value: ask-often, label: Ask often }
      - { value: ask-risky, label: Ask on risky steps }
      - { value: act-and-report, label: Act and report }
    default: ask-risky
    agents:
      claude:  { support: native, via: "permissions in .claude/settings.json" }
      codex:   { support: fallback, via: AGENTS.md rule }
      copilot: { support: fallback, via: AGENTS.md rule }
  - id: idea.text
    ref: "1.1"
    scope: team
    mode: Q
    type: text
    label: "Purpose/Idea: What should the project do?"
    maxWords: 500
    help: idea
    hint: Include the intended users, their main task, and important data or interface constraints.
    required: true
    default: ""
  - id: idea.team
    ref: "1.5"
    scope: team
    mode: Q
    type: choice
    label: "Team: Who works on this project?"
    hint: "Team settings are committed for everyone; personal settings stay in ~/.yaw on your machine. GitHub remains optional."
    choices:
      - { value: solo, label: Solo }
      - { value: team, label: Team }
    default: solo
  - id: tasks.use-github
    ref: "10.2"
    mode: Q
    type: boolean
    label: "GitHub: Use GitHub for the repo?"
    hint: "GitHub is optional; off keeps development local. This does not create a remote repository."
    default: false
  # The stack is language x runs-on (ADR-0054): together they pick exactly one profile, tailored or basic.
  # A pair no profile covers is rejected with the hosting targets covered by this kit.
  - id: arch.language
    ref: "3.1"
    scope: team
    mode: Q
    type: choice
    label: "Language: What language do you want to use?"
    help: stack
    required: true
    choices:
      - { value: python, label: "Python" }
      - { value: typescript, label: "TypeScript" }
      - { value: php, label: "PHP" }
      - { value: kotlin, label: "Kotlin" }
      - { value: html, label: "HTML, CSS & JavaScript" }
      - { value: go, label: "Go" }
      - { value: rust, label: "Rust" }
      - { value: swift, label: "Swift" }
      - { value: java, label: "Java" }
    default: ""
  - id: arch.runs-on
    ref: "3.2"
    scope: team
    mode: Q
    type: choice
    label: "Destination: Where will it run?"
    help: stack
    required: true
    choices:
      - { value: local, label: "your computer: command-line tools, scripts, data jobs" }
      - { value: self-hosted, label: "your own server: web app or API" }
      - { value: serverless, label: "serverless functions: Vercel, Netlify Functions, AWS Lambda" }
      - { value: edge, label: "edge / CDN: Cloudflare Workers, close to users" }
      - { value: static, label: "static hosting: GitHub Pages, Netlify; no server code" }
      - { value: wordpress, label: "inside WordPress: a plugin for an existing site" }
      - { value: app-store, label: "desktop or mobile app: macOS, Windows, Linux, iOS, Android" }
      - { value: browser-extension, label: "browser extension: Chrome, Edge, Firefox" }
    default: ""
  - id: arch.library-strategy
    scope: team
    mode: S
    type: choice
    label: "Libraries: Build or reuse?"
    hint: Prefer built-in tools and your own code, or suitable external libraries.
    choices:
      - { value: prefer-built-in, label: Prefer built-in and own code }
      - { value: prefer-libraries, label: Use suitable libraries }
    default: prefer-built-in
  - id: arch.wrapper
    scope: team
    mode: S
    type: choice
    label: "Wrapper: How should common commands run?"
    hint: Common project commands.
    choices:
      - { value: off, label: Off }
      - { value: shell, label: Shell }
      - { value: just, label: Just }
      - { value: make, label: Make }
    default: just
  - id: arch.docker
    scope: team
    mode: S
    type: boolean
    label: Support Docker
    hint: Tells the agent to set up Docker support.
    default: false
  - id: quality.unit-tests
    scope: team
    mode: S
    type: boolean
    label: Unit Tests
    hint: "Part of `just check`: it needs a non-empty, passing unit-test suite. Off: unit tests stay optional."
    default: false
  # Legacy project answers remain readable; these questions are no longer asked.
  # Error, log and documentation rules are generated from language, destination and modules (T-031).
  - id: quality.error-detail
    scope: team
    mode: F
    type: choice
    label: User-facing errors
    hint: Recovery detail for users; internal traces stay private.
    choices:
      - { value: concise, label: Concise }
      - { value: detailed, label: Detailed guidance }
    default: concise
  - id: quality.log-output
    scope: team
    mode: F
    type: choice
    label: Diagnostic logs
    hint: Structured diagnostics with redaction and bounded retention.
    choices:
      - { value: console, label: Console }
      - { value: file, label: Files }
      - { value: both, label: Console and files }
    default: console
  - id: quality.documentation
    scope: team
    mode: F
    type: choice
    label: Internal documentation
    hint: Setup and contracts, or fuller maintenance guides.
    choices:
      - { value: essential, label: Essential }
      - { value: detailed, label: Detailed }
    default: essential
  - id: arch.framework
    ref: "3.12"
    scope: team
    mode: F
    type: text
    label: Required framework (optional)
    hint: Existing project requirement, e.g. Django. Otherwise leave blank.
    default: ""
  - id: arch.hosting-control
    ref: "3.7"
    scope: team
    mode: F
    type: choice
    label: Who manages hosting?
    hint: Hosting ownership for the project plan.
    choices:
      - { value: on-premises, label: "On premises" }
      - { value: self-hosted, label: "Self-managed" }
      - { value: managed, label: "Managed hosting" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.libraries
    ref: "3.8"
    scope: team
    mode: F
    type: choice
    label: Libraries
    hint: Allowed packages.
    choices:
      - { value: standard-only, label: "Built-in only" }
      - { value: open-source, label: "Open source" }
      - { value: commercial-allowed, label: "Commercial too" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.services
    ref: "3.9"
    scope: team
    mode: F
    type: choice
    label: External services
    hint: Hosted auth, databases or APIs.
    choices:
      - { value: none, label: "No external services" }
      - { value: approved-only, label: "Approved services only" }
      - { value: allowed, label: "Proposals welcome" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.cost
    ref: "3.10"
    scope: team
    mode: F
    type: choice
    label: Budget
    hint: Hosting and paid components.
    choices:
      - { value: free-only, label: "Free components only" }
      - { value: capped, label: "Within a budget" }
      - { value: flexible, label: "Estimate for review" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.cost-limit
    ref: "3.11"
    scope: team
    mode: F
    type: text
    label: Budget cap (amount, currency, period)
    hint: For example EUR 20 / month. Leave blank to agree during planning.
    when: { arch.cost: capped }
    default: ""
