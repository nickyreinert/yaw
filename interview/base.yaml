# interview/base.yaml: questions every setup asks (doc 02 §3, doc 03, ADR-0017).
# Step 3 holds the Quick subset (mode Q) that a built module or the profile suggestion uses.
# Modules add theirs in module.yaml#questions; more questions of doc 03 follow with their modules (step 5, 7).
questions:
  - id: user.agents
    ref: "0.0"
    scope: user
    mode: Q
    type: multi
    label: Which coding agents should this setup support? (comma-separated)
    help: agents
    choices:
      - { value: claude, label: Claude Code }
      - { value: codex, label: Codex }
      - { value: copilot, label: Copilot }
      - { value: gemini, label: Gemini CLI (enterprise / API key), phase: 3 }
    default: [claude]
  - id: user.expertise
    ref: "0.1"
    scope: user
    mode: Q
    type: choice
    label: Your experience with software development?
    help: expertise
    choices: [layperson, intermediate, expert]
    default: intermediate
  - id: user.language
    ref: "0.2"
    scope: user
    mode: Q
    type: text
    label: Language for chat with the agent?
    default: de
  - id: user.autonomy
    ref: "0.7"
    scope: user
    mode: Q
    type: choice
    label: How often should the agent ask before acting?
    help: autonomy
    choices:
      - { value: ask-often, label: Ask often }
      - { value: ask-risky, label: Ask on risky or ambiguous steps }
      - { value: act-and-report, label: Act and report }
    default: ask-risky
    agents:
      claude:  { support: native, via: "permissions in .claude/settings.json" }
      codex:   { support: fallback, via: AGENTS.md rule }
      copilot: { support: fallback, via: AGENTS.md rule }
  - id: idea.text
    ref: "1.1"
    mode: Q
    type: text
    label: Describe the idea in a few sentences.
    help: idea
    hint: Include the intended users, their main task, and important data or interface constraints.
    required: true
    default: ""
  - id: idea.team
    ref: "1.5"
    mode: Q
    type: choice
    label: Solo or team?
    hint: Shared team rules; with GitHub enabled, Full also requires issues and PRs (doc 14). Git can use a remote in another local folder instead.
    choices: [solo, team, external-reviewers]
    default: solo
  - id: tasks.use-github
    ref: "10.2"
    mode: Q
    type: boolean
    label: Use GitHub for the repo?
    hint: "GitHub is optional; off keeps development local. This does not create a remote repository."
    default: false
  # The stack is language x runs-on (ADR-0054): together they pick exactly one profile, tailored or basic.
  # A pair no profile covers is rejected with the places that language can run.
  - id: arch.language
    ref: "3.1"
    mode: Q
    type: choice
    label: What language do you want to use?
    help: stack
    required: true
    choices:
      - { value: python, label: "Python" }
      - { value: javascript, label: "TypeScript" }
      - { value: php, label: "PHP" }
      - { value: kotlin, label: "Kotlin" }
      - { value: html, label: "HTML, CSS & JavaScript" }
      - { value: go, label: "Go" }
      - { value: rust, label: "Rust" }
      - { value: swift, label: "Swift" }
      - { value: java, label: "Java" }
    default: ""
  - id: arch.runs-on
    ref: "3.2"
    mode: Q
    type: choice
    label: Where will it run?
    help: stack
    required: true
    choices:
      - { value: local, label: "your computer: command-line tools, scripts, data jobs" }
      - { value: self-hosted, label: "your own server: web app or API, usually in Docker" }
      - { value: serverless, label: "serverless functions: Vercel, Netlify Functions, AWS Lambda" }
      - { value: edge, label: "edge / CDN: Cloudflare Workers, close to users" }
      - { value: static, label: "static hosting: GitHub Pages, Netlify; no server code" }
      - { value: wordpress, label: "inside WordPress: a plugin for an existing site" }
      - { value: app-store, label: "desktop or mobile app: macOS, Windows, Linux, iOS, Android" }
    default: ""
  - id: arch.framework
    ref: "3.12"
    mode: F
    type: text
    label: Existing framework to keep? (optional)
    hint: Only for an existing requirement, such as keeping Django. Leave blank for a new project; language and runtime choose the kit profile.
    default: ""
  - id: arch.hosting-control
    ref: "3.7"
    mode: F
    type: choice
    label: Who manages hosting?
    hint: Guides the architecture plan; separate from where the code runs.
    choices:
      - { value: on-premises, label: "On premises" }
      - { value: self-hosted, label: "Self-managed" }
      - { value: managed, label: "Managed hosting" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.libraries
    ref: "3.8"
    mode: F
    type: choice
    label: Which libraries are allowed?
    hint: Installed code, not hosted services. Guides build-versus-reuse choices.
    choices:
      - { value: standard-only, label: "Built-in only" }
      - { value: open-source, label: "Open source" }
      - { value: commercial-allowed, label: "Commercial too" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.services
    ref: "3.9"
    mode: F
    type: choice
    label: Can the app use external services?
    hint: Hosted auth, databases or APIs. Guides data flows in the plan.
    choices:
      - { value: none, label: "No external services" }
      - { value: approved-only, label: "Approved services only" }
      - { value: allowed, label: "Proposals welcome" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.cost
    ref: "3.10"
    mode: F
    type: choice
    label: What can the architecture cost?
    hint: Hosting, libraries, APIs and subscriptions. Purchases still need approval.
    choices:
      - { value: free-only, label: "Free components only" }
      - { value: capped, label: "Within a budget" }
      - { value: flexible, label: "Estimate for review" }
      - { value: undecided, label: "Decide later" }
      - { value: no-preference, label: "Doesn’t matter" }
    default: undecided
  - id: arch.cost-limit
    ref: "3.11"
    mode: F
    type: text
    label: Budget cap (amount, currency, period)
    hint: For example EUR 20 / month. Leave blank to agree during planning.
    when: { arch.cost: capped }
    default: ""
