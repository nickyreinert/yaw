    <path d="m129 18 14 22M134 18l14 22"/>
    <path d="m143 40 9-36M148 40l9-36"/>
  </g>
  <g stroke="#52bfc2" stroke-width="1" opacity=".85" stroke-linecap="butt">
    <path d="M6 4 27 22M52 4 31 22M27 22l5 18"/>
    <path d="M60 40 79 4M79 4l19 36M67 25h22"/>
