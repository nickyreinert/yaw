<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" fill="none" role="img" aria-labelledby="title">
  <title id="title">YAW</title>
  <g stroke="#d9f1e8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter">
