# modules/security/module.yaml (Y-5.0, ADR-0022): minimal guards (BD6); in Quick (ADR-0009).
name: security
description: Denies reading .env and secret files and guards destructive commands (rm -rf, force push, prod deploy).
title: Safety guard
group: basics
short: "Blocks secret reads and destructive commands"
what: "Stops agents from reading secrets and from running destructive commands unless you run them yourself."
adds:
  - "Blocks agents from reading secret files (.env, keys)"
  - "Blocks destructive commands (rm -rf, force push) unless you run them"
example: { when: "Agent runs", run: "cat .env", then: "blocked: \"secret file; ask the user\". Same for rm -rf, force push, prod deploy." }
depends: [core]
default: { quick: true, standard: true, full: true }
questions: []
outputs:
  templates: [.claude/settings.json]
  hooks:
    - name: guard-secret-read
      event: PreToolUse
      matcher: Read|Edit|MultiEdit|Grep|Bash
      kind: guard
    - name: guard-destructive
      event: PreToolUse
      matcher: Bash
      kind: guard
agentsMd: |
  - Never read `.env*` or other secret files; ask the user to run the command instead.
  - Destructive commands (rm -rf, force push, prod deploy) are blocked unless the user runs them.
agents:
  claude:  { support: native, via: "PreToolUse permissionDecision deny + permissions.deny" }
  codex:   { support: native, via: "PreToolUse on Bash and apply_patch; hooks must be trusted via /hooks" }
  copilot: { support: partial, via: "runs the .claude/settings.json hooks", note: "deny shape from the Copilot CLI docs; not verified in a live session" }
tokenCost: none
lastVerified: 2026-10-20
