# modules/core/module.yaml (Y-3.2)
name: core
description: AGENTS.md, CLAUDE.md, .gitignore, justfile and the manifest.
title: Project rules
group: basics
short: "AGENTS.md · agent imports · justfile · .gitignore"
what: "AGENTS.md: agent entry point · CLAUDE.md / GEMINI.md: rules imports · justfile: project commands · .gitignore: exclusions"
adds:
  - "AGENTS.md — agent entry point"
  - "CLAUDE.md / GEMINI.md — selected agent imports"
  - "justfile — project commands"
  - "docs/engineering.md — project testing, errors, logs and maintenance rules"
  - ".gitignore — ignored files"
depends: []
default: { quick: true, standard: true, full: true }
questions: []
outputs:
  templates: [AGENTS.md, CLAUDE.md, GEMINI.md, .gitignore, justfile, docs/engineering.md, project.sh, Makefile]
agentsMd: |
  - Start every task with `yaw kickoff context`, `TASKS.md` (if present) and decision retrieval (if enabled); apply kit practices within project ground truth, flag conflicts and update affected sources with agreed behavior changes.
  - Do not assume. If a request is vague or has several reasonable readings, ask the user before acting.
  - Run `just check` before you report a task as done; `just --list` shows all recipes.
  - Never read, print or commit secrets (`.env*`, keys, tokens); ask the user to enter them.
agents:
  claude:  { support: native, via: "CLAUDE.md imports AGENTS.md" }
  codex:   { support: native, via: AGENTS.md }
  copilot: { support: native, via: AGENTS.md }
  gemini:  { support: native, via: "GEMINI.md imports AGENTS.md" }
tokenCost: low
lastVerified: 2026-10-20
