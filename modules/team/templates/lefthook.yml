# Workflow rules (team module, ADR-0031): every commit names its issue. The pre-push job (no push to the default
# branch) sits in the git-hooks frame, so the review gate can share the pre-push key.
commit-msg:
  jobs:
    - name: issue-reference
      run: |
        msg="{1}"
        # Messages git writes itself (merge, revert) and fixup/squash commits pass; the rest needs "#<n>".
        if head -n 1 "$msg" | grep -Eq '^(Merge |Revert "|fixup! |squash! |amend! )'; then exit 0; fi
        if grep -v '^#' "$msg" | grep -Eq '#[0-9]+'; then exit 0; fi
        echo 'workflow rules: the commit message names no issue; add "Refs #<n>" (just commit adds it)' >&2
        exit 1
