# modules/team/module.yaml (Y-5.9, ADR-0031): team-mode enforcement (doc 14 §2-§3).
# The binding layers are lefthook commit-msg / pre-push, the pr-policy CI check and the ruleset (`just gh-protect`,
# github module). There is no agent-side command guard: the AGENTS.md rules are guidance (ADR-0031). The session
# start talks to the user (systemMessage); the only model-visible output is the active issue (BUILD.md rule 5).
name: team
description: "Workflow rules: no change without an issue (lefthook commit-msg and pre-push, the pr-policy check: the PR links an open issue, rules for the agent in AGENTS.md) and a session-start sync (fetch, safe fast-forward, my issues and pull requests). For solo projects and teams on GitHub."
title: Workflow rules
group: github
short: "No change without an issue"
what: "Every change starts from a GitHub issue, whether you work solo or in a team. At session start you see your open issues and pull requests; the agent gets the active issue."
details:
  - "Commits must name an issue (Refs #12); `just commit` adds it, and the git hook rejects a commit without one"
  - "Pushing to the default branch is blocked; push an issue branch and open a pull request with `just pr`"
  - "Pull requests must link an open issue (Closes #12), checked by the pr-policy workflow"
  - "Session start fetches, fast-forwards when safe and lists your issues and pull requests; it creates nothing"
  - "The agent is told the active issue (number and title) from the branch name; the question below switches it off"
  - "`just pr` pushes the branch and opens a draft pull request that closes the issue; `just start` repeats the session-start overview"
  - "Tasks are tracked as GitHub issues; TASKS.md becomes a generated read-only view"
  - "Preselected for teams, available to solo projects; `just gh-protect` asks teams for one approval, solo for none"
adds:
  - "Rule: no change without an issue"
  - "Open issues and pull requests shown at session start"
  - "Push guard for the default branch and a pull-request policy check"
example: { when: "A commit without #12", run: "git push", then: "rejected: \"link an open issue\"." }
depends: [tasks, github, git-hooks]
default: { quick: false, standard: { team: true }, full: { team: true } }
appliesTo: { usesGitHub: true }
questions:
  - id: team.session-context
    mode: F
    type: boolean
    when: { idea.team: team, tasks.use-github: true }
    label: "Active issue: Tell the agent the active issue at session start?"
    hint: One line (issue number and title of the current branch); off saves those tokens.
    default: true
outputs:
  templates: [lefthook.yml, .lefthook/pre-push/yaw-default-branch.sh, .github/workflows/pr-policy.yml, just/team.just, justfile]
  hooks:
    # User only: fetch, fast-forward when safe, my issues and pull requests (systemMessage). Runs first, so the
    # context hook below can read the issue title from the cache it writes.
    - name: session-sync
      event: SessionStart
      kind: comfort
      tokenCost: none
      agents:
        claude: { support: native, via: "SessionStart systemMessage (user-visible only)" }
        codex: { support: native, via: "SessionStart systemMessage (user-visible only)" }
        copilot: { support: none, note: "no user message at session start; `just start` is the fallback" }
    # The active issue, one line, once per session start: the active-task re-injection of BUILD.md rule 5.
    - name: session-issue
      event: SessionStart
      kind: context
      tokenCost: low
agents:
  claude:  { support: native, via: "SessionStart sync + active issue; git hooks and CI check apply; AGENTS.md rules (guidance)" }
  codex:   { support: native, via: "SessionStart sync + active issue; git hooks and CI check apply; hooks must be trusted via /hooks" }
  copilot: { support: partial, via: "SessionStart active issue (additionalContext); git hooks and CI check apply", note: "no session-start message; `just start` is the fallback" }
agentsMd: |
  - Workflow rules: no change without an issue. Work on an issue branch (`just task start <#>`), never on the default branch or a branch without an issue number.
  - Commit messages name the issue (`Refs #<n>`, `just commit` adds it); never push to the default branch, never force-push, never skip hooks (`--no-verify`); every PR links an open issue (`Closes #<n>`, `just pr` adds it). Git hooks, the pr-policy check and the branch ruleset enforce this.
  - Without session-start hooks, run `just start` first: it fetches, fast-forwards when safe and lists your issues and pull requests.
tokenCost: low
lastVerified: 2026-10-21
