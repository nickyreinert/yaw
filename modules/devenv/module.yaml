# modules/devenv/module.yaml (Y-5.2, ADR-0025): one-command setup and env template; Docker is the Architecture switch.
name: devenv
description: .env.example, git-ignored .env files and `just setup` creating .env from the example.
title: Local settings & secrets
group: basics
short: "Env template and private .env"
what: ".env.example with the names your project needs, a git-ignored .env, and `just setup` to create it."
adds:
  - ".env.example with the names your project needs"
  - "Git-ignored .env, created by just setup"
example: { when: "New computer", run: "just setup", then: ".env is created from the example; you fill in the values." }
depends: [core]
default: { quick: true, standard: true, full: true }
questions: []
outputs:
  templates: [.env.example, .gitignore]
agentsMd: |
  - Set up with `just setup`, run with `just dev`. `.env` is git-ignored; put new variable names (never values) in `.env.example` and ask the user for the values.
agents:
  claude:  { support: native, via: "AGENTS.md rule + .env.example" }
  codex:   { support: native, via: "AGENTS.md rule + .env.example" }
  copilot: { support: native, via: "AGENTS.md rule + .env.example" }
tokenCost: low
lastVerified: 2026-10-21
