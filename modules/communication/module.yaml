# modules/communication/module.yaml (Y-5.1, ADR-0013, ADR-0024): speaking style from the user profile.
name: communication
description: The answer style (depth, response, experience). Personal by default (T-027), kept in ~/.yaw/user-profile.yaml and never committed; switched to team, it is rendered into AGENTS.md and, when it is not the default, a Claude output style.
title: How the agent talks to you
group: basics
short: "How long and how explained"
what: "Answer depth and responses, with wording and examples following your experience, taken from your personal profile."
adds:
  - "Personal: your answer style stays in ~/.yaw/user-profile.yaml, nothing is committed"
  - "Switched to team: notes in AGENTS.md and a Claude output style when you leave the defaults"
example: { when: "Profile: short, in German, explain choices", then: "\"Ich nehme SQLite, weil die Daten lokal bleiben.\"" }
depends: [core]
default: { quick: true, standard: true, full: true }
questions:
  - id: user.length
    ref: "0.3"
    scope: user
    mode: Q
    type: choice
    label: "Depth: How long should answers be?"
    choices:
      - { value: brief, label: Brief & on point }
      - { value: balanced, label: Balanced }
      - { value: extensive, label: Extensive }
    default: balanced
  - id: user.explain
    ref: "0.6"
    scope: user
    mode: S
    type: choice
    label: "Response: Should the agent explain its actions?"
    choices:
      - { value: one-line, label: Short confirmation }
      - { value: short-paragraph, label: Detailed change report }
      - { value: on-request, label: Only on request }
    default: short-paragraph
outputs:
  # Each template renders to nothing (no file) while the style is personal (T-027) or, for the Claude ones, with default style (ADR-0013, ADR-0024).
  templates: [AGENTS.md, .claude/output-styles/yaw.md, .claude/settings.json]
agents:
  claude:  { support: native, via: "AGENTS.md section + .claude/output-styles/yaw.md selected by outputStyle" }
  codex:   { support: native, via: AGENTS.md }
  copilot: { support: native, via: AGENTS.md }
tokenCost: low
lastVerified: 2026-10-21
