# modules/github/module.yaml (Y-5.5, ADR-0027): GitHub scripts as `just` recipes (doc 10 §3).
name: github
description: GitHub recipes, issue forms and planning skills, a PR template and .yaw/github.yaml; configured task Project and epic milestone updates need guarded confirmation.
title: GitHub workflow
group: github
what: "Issue forms, a pull-request template and planning skills, so the agent can turn a plan into issues."
example: { when: "You ask", run: "\"split this plan into issues\"", then: "5 issues with labels, ready to review." }
depends: [core]
default: { quick: false, standard: true, full: true }
# Off when the user does not use GitHub, including teams with a local Git remote.
appliesTo: { usesGitHub: true }
questions: []
outputs:
  templates: [.yaw/github.yaml, .github/pull_request_template.md, .claude/settings.json, .github/ISSUE_TEMPLATE/feature.yml, .github/ISSUE_TEMPLATE/bug.yml, .github/ISSUE_TEMPLATE/chore.yml, .github/ISSUE_TEMPLATE/spike.yml, .github/ISSUE_TEMPLATE/epic.yml, just/github.just, justfile]
  skills: [issue-create, issue-triage, epic-plan]
agentsMd: |
  - Git and GitHub work goes through `just branch`, `commit`, `pr`, `pr-status`, `gh-issue`; guarded recipes (`gh-init`, `gh-labels`, `gh-protect`, `project-add`, `release`, first push) run only when the user types `y`, so ask the user and never work around it. There is no recipe to merge, force-push, delete a branch or change repo visibility: the user does those.
agents:
  claude:  { support: native, via: "just recipes + AGENTS.md rules + permissions.ask in .claude/settings.json (the user confirms guarded commands)" }
  codex:   { support: partial, via: "just recipes + AGENTS.md rules", note: "no permission prompt from the kit; Codex approval settings apply" }
  copilot: { support: partial, via: "just recipes + AGENTS.md rules", note: "no permission prompt from the kit" }
tokenCost: low
lastVerified: 2026-10-21
