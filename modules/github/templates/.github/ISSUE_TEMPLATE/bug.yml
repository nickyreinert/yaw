name: Bug
description: Report something that does not work as expected.
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the steps, expected result, actual result and relevant versions. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result will show the bug is fixed?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 blocks release; P1 needed; P2 desirable; P3 may wait.
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Relative size, not a promise of delivery time.
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Target release or phase; use Unscheduled if not agreed.
    validations:
      required: true
