name: Chore
description: Propose maintenance, tooling or documentation work.
labels: ["type:chore"]
body:
  - type: textarea
    id: brief
    attributes:
      label: Brief
      description: Explain what should change and why it is useful.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete checks that show the maintenance work is complete.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 blocks release; P1 needed; P2 desirable; P3 may wait.
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Relative size, not a promise of delivery time.
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Target release or phase; use Unscheduled if not agreed.
    validations:
      required: true
