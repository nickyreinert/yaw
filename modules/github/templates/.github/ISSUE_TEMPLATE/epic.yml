name: Epic
description: Describe a larger outcome delivered through linked sub-issues.
labels: ["type:epic", "status:todo"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: Who benefits, what is included, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable outcomes for the epic as a whole.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 blocks release; P1 needed; P2 desirable; P3 may wait.
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Initial relative size; refine using the linked sub-issues.
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Recommended model
      description: The cheapest tier that fits the work; a small model can take routine edits, the top tier architecture and hard problems.
      options: [low tier (Haiku), middle tier (Sonnet), top tier (Opus)]
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Reasoning effort
      description: How much reasoning the work needs; low for routine edits, max for the hardest problems.
      options: [low, medium, high, xhigh, max]
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Target release or phase; configure its epic mapping in .yaw/github.yaml after creation.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Sub-issues
      description: Proposed work breakdown. Use native sub-issue links after creation, not just a checklist.
