# CI steps fragment: the toolchain, then the same gate as local.
# Actions are pinned by commit SHA (ADR-0027).
steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  - uses: actions/setup-go@40f1582df8db1f2693623bafd20cd98cdaf06a39 # v5.6.0
    with:
      go-version: "1.22"
  - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
  - run: just setup
  - run: just check
