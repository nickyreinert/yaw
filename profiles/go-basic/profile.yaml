# profiles/go-basic/profile.yaml
# Basic stack (ADR-0054): standard Go tools wherever Go runs without a tailored profile.
name: go-basic
title: Basic Go project
summary: Go project; gofmt, go vet, go test, optional staticcheck.
stack:
  language: [go]
  runsOn: [app-store]
  basic: true
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [go>=1.22, just]
# Warning lines a passing step still shows with the compact module: go command warnings, missing-tool notes.
compact:
  warnings: '^go: warning: |^[a-z-]+: .* is not installed'
