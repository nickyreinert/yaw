# profiles/php-web/profile.yaml
# Picked for PHP x your own server (ADR-0054, was ADR-0037).
# Profile options (Laravel, MariaDB, doc 05 §2) come with the full interview (step 7); the scaffold is plain PHP without a database.
name: php-web
title: Plain PHP web app
dependencyEcosystems: [composer]
summary: Plain PHP web app; Composer, PHPStan, PHP-CS-Fixer, PHPUnit, composer audit.
stack:
  language: [php]
  runsOn: [self-hosted]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [php>=8.2, composer, just]
