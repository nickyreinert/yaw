# profiles/python-web/profile.yaml
# Picked for Python x your own server (ADR-0054, was ADR-0035).
# Profile options (framework, db; doc 05 §2) come with the full interview (step 7); the scaffold is FastAPI without a database.
name: python-web
title: FastAPI web app
dependencyEcosystems: [pip]
summary: FastAPI web app, self-hosted; uv venv, ruff, pyright, pytest, bandit, pip-audit, Dockerfile.
stack:
  language: [python]
  runsOn: [self-hosted]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [just, uv]
# Warning lines a passing step still shows with the compact module: Python warnings (pytest warnings summary), uv and pyright warnings, missing-tool notes.
compact:
  warnings: '\w+Warning: |^warning: | - warning: |^[a-z-]+: .* is not installed'
