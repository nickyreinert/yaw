# Dangerous command patterns of this stack (doc 04 §3). Read by the security module (step 5.0).
# pattern is a regular expression matched against the command line.
guards:
  - { id: docker-push, pattern: "\\bdocker\\s+(image\\s+)?push\\b", reason: Pushing an image to a registry needs your approval. }
  - { id: ssh-host, pattern: "\\b(ssh|scp)\\s+\\S", reason: Reaching a remote host (production) needs your approval. }
  - { id: remote-docker, pattern: "\\bdocker\\s+(-H|--host|--context)\\b", reason: Running Docker against a remote host needs your approval. }
  - { id: prod-migration, pattern: "\\balembic\\b.*\\b(upgrade|downgrade|stamp)\\b.*\\b(prod|production)\\b|\\b(prod|production)\\b.*\\balembic\\b", reason: Production migrations need your approval. }
  - { id: pypi-publish, pattern: "\\b(twine\\s+upload|uv\\s+publish)\\b", reason: Publishing to PyPI needs your approval. }
