# Dangerous command patterns of this stack (doc 04 §3). Read by the security module (step 5.0).
# pattern is a regular expression matched against the command line.
guards:
  - { id: twine-upload, pattern: "\\btwine\\s+upload\\b", reason: Publishing to PyPI needs your approval. }
  - { id: uv-publish, pattern: "\\buv\\s+publish\\b", reason: Publishing to PyPI needs your approval. }
