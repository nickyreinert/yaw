# profiles/python-cli/profile.yaml
# Profile options (doc 05 §2, e.g. pyright or mypy) come with the full interview (step 7); step 3 renders pyright.
name: python-cli
title: Python tool or data job
summary: Python script, tool or data job; uv venv, no Docker.
stack:
  language: [python]
  runsOn: [local]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [just, uv]
dependencyEcosystems: [pip]
