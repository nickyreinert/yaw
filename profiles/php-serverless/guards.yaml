# Dangerous command patterns of this stack (doc 04 §3). Read by the security module (step 5.0).
# pattern is a regular expression matched against the command line.
guards:
  - { id: composer-global, pattern: "\\bcomposer\\b[^;&|)]*\\b(global|self-update|selfupdate)\\b", reason: Changing the machine-wide Composer setup needs your approval. }
  - { id: registry-push, pattern: "\\b(docker|podman|buildah|nerdctl)(-compose)?\\b.*(\\bpush\\b|--push)|\\bgcloud\\b.*\\bbuilds\\s+submit\\b", reason: Pushing an image to a registry needs your approval. }
  - { id: cloud-cli, pattern: "(^|[;&|(\\s])(aws\\s[^;&|)]*\\s(create|delete|update|put|deploy|remove|terminate|run|start|stop|invoke)[\\w-]*(\\s|$)|aws\\s[^;&|)]*\\s(cp|mv|rm|sync|mb|rb)(\\s|$)|sam\\s+(deploy|delete|sync|publish)\\b|gcloud\\s[^;&|)]*\\s(deploy|create|delete|update|submit)[\\w-]*(\\s|$))", reason: Deploying or changing cloud resources with aws or sam or gcloud is yours to run. }
  - { id: remote-host, pattern: "\\b(ssh|scp|sftp|ftp|lftp)\\s+\\S|\\brsync\\b.*\\s[^\\s/.][^\\s/]*:\\S|\\bDOCKER_HOST=|\\bdocker\\s+(-H|--host\\b|--context\\b)", reason: Reaching a remote host needs your approval. }
