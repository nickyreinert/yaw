# profiles/java-serverless
# Picked for Java x serverless (ADR-0054); the hosting option picks the scaffold variant (ADR-0105, ADR-0127).
name: java-serverless
title: Java serverless app
dependencyEcosystems: [gradle]
summary: Java app for serverless hosts, as a container or on AWS Lambda; Gradle, Spotless, JUnit 5.
stack:
  language: [java]
  runsOn: [serverless]
  notes:
    serverless: The gate runs without Docker or AWS accounts; building images, deploying and cloud accounts are yours.
options:
  hosting:
    label: "Serverless flavor: container (Cloud Run style) or AWS Lambda"
    hint: Container ships a service on the JDK HTTP server with a Dockerfile; Lambda ships an API Gateway handler packaged as a zip.
    choices:
      - { value: container, label: "Container (JDK HTTP server, Dockerfile, Cloud Run style)" }
      - { value: lambda, label: "AWS Lambda (RequestHandler, zip package)" }
    default: container
    scaffold: true
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [jdk>=17, just]
tools:
  - name: aws
    check: aws --version
    install:
      macos: brew install awscli
      linux: curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip && unzip awscliv2.zip && sudo ./aws/install
    when: { hosting: lambda }
  - name: sam
    check: sam --version
    install:
      macos: brew install aws-sam-cli
      linux: pipx install aws-sam-cli
    when: { hosting: lambda }
