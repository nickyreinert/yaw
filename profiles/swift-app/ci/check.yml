# CI steps fragment: Swift toolchain, then `just check` (same gate as local). No signing, no credentials.
# The generated workflow runs on ubuntu: there the SwiftUI branch is compiled out and the AppCore logic is built and tested.
# Actions are pinned by commit SHA (Y-5.5, ADR-0027); the comment names the version the SHA was verified for.
steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
    with:
      swift-version: "6.1"
  - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
  - run: just setup
  - run: just check
