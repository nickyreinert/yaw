[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
lambda_http = { version = "=1.3.2" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
