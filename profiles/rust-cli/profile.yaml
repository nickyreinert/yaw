# profiles/rust-cli
# Picked for Rust x your computer (ADR-0054, T-001): command-line tools built with Cargo.
name: rust-cli
title: Rust command-line tool
summary: Rust command-line tool; Cargo, rustfmt, clippy, cargo test, no third-party crates.
stack:
  language: [rust]
  runsOn: [local]
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [rustc>=1.80, cargo, just]
# Warning lines a passing step still shows with the compact module: compiler and clippy warnings (not the "generated N warnings" summary), missing-tool notes.
compact:
  warnings: '^warning: (?!.*\bgenerated \d+ warnings?)|^[a-z-]+: .* is not installed'
