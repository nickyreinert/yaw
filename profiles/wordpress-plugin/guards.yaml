# Dangerous command patterns of this stack (doc 04 §3). Read by the security module (step 5.0).
# pattern is a regular expression matched against the command line.
guards:
  # Any svn command that writes (commit/ci/import, lock, property changes, patch) in any position of the command (svn --username x commit, sudo, env, bash -c, xargs); svnmucc and git svn dcommit.
  - { id: svn-write, pattern: "\\bsvnmucc\\b|\\bgit\\s+svn\\s+(dcommit|set-tree)\\b|\\bsvn\\b(?=[^;&|)\\n]*\\s(commit|ci|import|lock|unlock|propset|pset|ps|propedit|pe|propdel|pdel|pd|patch)\\b)|\\bsvn\\b(?=[^;&|)\\n]*\\s(delete|del|remove|rm|copy|cp|move|mv|rename|ren|mkdir)\\b)(?=[^;&|)\\n]*\\s(https?|svn|svn\\+ssh|file)://)", reason: Releasing to the WordPress.org SVN (or any SVN write) needs you to run it. }
  # A release/deploy script as a command (bash deploy.sh, ./bin/deploy.sh, sudo, env, nohup, python) or a task runner target (npm run deploy, composer deploy, make deploy, just deploy).
  - { id: deploy-script, pattern: "(?:^|[;&|(`\"'\\n]|\\$\\()\\s*(?:(?:(?:sudo|env|bash|sh|zsh|dash|ksh|source|\\.|exec|nohup|time|command|xargs|python3?|node|php|ruby|perl)\\s+(?:\\S+\\s+){0,3}?)|(?:\\w+=\\S*\\s+))*(?:\\S*/)?(?![\\w.-]*(?:test|spec))(?:deploy|release|publish)(?:[-_.][A-Za-z0-9]+)*\\.(?:sh|bash|py|js|mjs|php|rb|pl)\\b|\\b(?:npm|pnpm|yarn|bun|composer|make|just|task|npx)\\b[^;&|)\\n]*(?<![\\w-])(?:deploy|release|publish)(?![\\w-])", reason: Releasing or deploying needs you to run it. }
  # wp-cli against another site (@alias, --ssh, --http) and wp-cli database commands that wipe or replace data.
  - { id: wp-cli-remote, pattern: "(?<![\\w-])wp(?![\\w-])(?=[^;&|)\\n]*(\\s@\\w|--ssh\\b|--http\\b|\\bdb\\s+(reset|drop|import|clean|repair)\\b))", reason: wp-cli against a remote site or a destructive database command needs your approval. }
  - { id: remote-host, pattern: "\\b(ssh|scp|sftp|ftp|lftp)\\s+\\S|\\brsync\\b.*\\s[^\\s/.][^\\s/]*:\\S", reason: Reaching a remote host (production) needs your approval. }
