# CI steps fragment: toolchain, then `just check` (same gate as local). No keystore, no signing key, no Play credentials, no secrets.
# Actions are pinned by commit SHA (Y-5.5, ADR-0027); the comment names the version the SHA was verified for.
# Runner: ubuntu-latest, no emulator, no KVM. The Android SDK is installed into ~/android-sdk and cached with the Gradle caches (ADR-0040).
steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
    with:
      distribution: temurin
      java-version: "21"
  - name: Android SDK location
    run: |
      echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
  - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: |
        ~/android-sdk
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: android-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
      restore-keys: android-${{ runner.os }}-
  - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    with:
      packages: platform-tools platforms;android-36 build-tools;36.0.0
  - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
  - run: just setup
  - run: just check
