# profiles/android-kotlin/profile.yaml
# Suggested for language kotlin (#164, ADR-0040); runs-on app-store fits, any other place contradicts it (Kotlin on a server: pick a profile yourself).
# The emulator, Paparazzi / Maestro screenshots and the device verbs of the remote dev loop (doc 11 §4) come later; the scaffold is one Compose activity with a JVM unit test.
name: android-kotlin
dependencyEcosystems: [gradle]
summary: Android app in Kotlin with Compose; Gradle, ktlint, detekt, Android Lint, JUnit.
suggestWhen:
  language: [kotlin]
  runsOn: [app-store]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [jdk>=17, android-sdk, just]
