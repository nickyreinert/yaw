# profiles/node-ts-vercel/profile.yaml
# Picked for JavaScript/TypeScript x serverless (ADR-0054, was ADR-0036).
# Profile options (framework: next | vite, doc 05 §2) come with the full interview (step 7); the scaffold is plain TypeScript with one serverless function.
name: node-ts-vercel
title: TypeScript app on Vercel
dependencyEcosystems: [npm]
summary: TypeScript app with serverless functions for Vercel; tsc, ESLint, Vitest, npm audit.
stack:
  language: [typescript]
  runsOn: [serverless]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [node>=22.13, just]
# Warning lines a passing step still shows with the compact module: npm and Node warnings, eslint/stylelint/html-validate warning rows, missing-tool notes.
compact:
  warnings: '^npm (warn|WARN) |^\(node:\d+\) \w*Warning: |^\s+\d+:\d+\s+(warning|⚠)\s|^[a-z-]+: .* is not installed'
