# profiles/node-static
# Picked for JavaScript/TypeScript x static hosting (ADR-0128, T-001): a Vite + TypeScript build to dist/, unlike static-site (plain HTML).
name: node-static
title: TypeScript static site built with Vite
dependencyEcosystems: [npm]
summary: TypeScript site built with Vite to static files in dist/; tsc, ESLint, Vitest, npm audit.
stack:
  language: [typescript]
  runsOn: [static]
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [node>=22.13, just]
# Warning lines a passing step still shows with the compact module: npm and Node warnings, eslint/stylelint/html-validate warning rows, missing-tool notes.
compact:
  warnings: '^npm (warn|WARN) |^\(node:\d+\) \w*Warning: |^\s+\d+:\d+\s+(warning|⚠)\s|^[a-z-]+: .* is not installed'
