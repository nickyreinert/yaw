# profiles/cloudflare-workers/profile.yaml
# Picked for JavaScript/TypeScript x edge (ADR-0054, was ADR-0039).
# D1, R2 and KV bindings, the local D1 migration and the Playwright screenshot come with the full interview (step 7); the scaffold is one plain TypeScript Worker.
name: cloudflare-workers
title: Cloudflare Worker in TypeScript
dependencyEcosystems: [npm]
summary: Cloudflare Worker in TypeScript; Wrangler (local only), tsc, ESLint, Vitest in the Workers runtime, npm audit.
stack:
  language: [typescript]
  runsOn: [edge]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [node>=22.13, just]
# Warning lines a passing step still shows with the compact module: npm and Node warnings, eslint/stylelint/html-validate warning rows, missing-tool notes.
compact:
  warnings: '^npm (warn|WARN) |^\(node:\d+\) \w*Warning: |^\s+\d+:\d+\s+(warning|⚠)\s|^[a-z-]+: .* is not installed'
