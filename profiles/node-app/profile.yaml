# profiles/node-app
# Picked for TypeScript x app store (ADR-0054); the framework option picks the scaffold variant (ADR-0105).
name: node-app
title: TypeScript app for app stores
dependencyEcosystems: [npm]
summary: TypeScript app for app stores or desktop (Capacitor, Electron or Tauri); tsc, ESLint, Vitest, a bundle build, npm audit.
stack:
  language: [typescript]
  runsOn: [app-store]
  notes:
    app-store: The gate runs without Xcode, the Android SDK or signing; native builds, signing and store uploads are yours.
options:
  framework:
    label: "App framework (a library; overrides prefer built-in)"
    hint: Capacitor targets iOS/Android; Electron and Tauri target desktop.
    choices:
      - { value: capacitor, label: "Capacitor (web app in a native shell)" }
      - { value: electron, label: "Electron (desktop)" }
      - { value: tauri, label: "Tauri (desktop, Rust shell)" }
    default: capacitor
    scaffold: true
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [node>=22.13, just]
tools:
  - name: rustc
    check: rustc --version
    install:
      macos: brew install rustup && rustup-init -y
      linux: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    when: { framework: tauri }
# Warning lines a passing step still shows with the compact module: npm and Node warnings, eslint/stylelint/html-validate warning rows, missing-tool notes.
compact:
  warnings: '^npm (warn|WARN) |^\(node:\d+\) \w*Warning: |^\s+\d+:\d+\s+(warning|⚠)\s|^[a-z-]+: .* is not installed'
