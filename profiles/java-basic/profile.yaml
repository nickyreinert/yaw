# profiles/java-basic/profile.yaml
# Basic stack (ADR-0054): standard Java tools where Java runs without a tailored profile.
name: java-basic
title: Basic Java project
dependencyEcosystems: [gradle]
summary: Java project; Gradle, JUnit 5, javac -Xlint.
stack:
  language: [java]
  runsOn: [app-store]
  basic: true
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [jdk>=17, just]
# Warning lines a passing step still shows with the compact module: Kotlin and javac warnings, the Gradle deprecation notice, missing-tool notes.
compact:
  warnings: '^w: |: warning: |^warning: |^Deprecated Gradle features |^[a-z-]+: .* is not installed'
