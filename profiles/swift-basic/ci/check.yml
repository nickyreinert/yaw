# CI steps fragment: Swift toolchain, then the same gate as local.
# Actions are pinned by commit SHA (ADR-0027).
steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  - uses: swift-actions/setup-swift@0b7eebf238fc639dc7c44b8eebcac19ce159ba08 # v2
    with:
      swift-version: "6.1"
  - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
  - run: just setup
  - run: just check
