# profiles/swift-basic/profile.yaml
# Basic stack (ADR-0054): standard Swift tools where Swift runs without a tailored profile.
name: swift-basic
title: Basic Swift project
summary: Swift project; Swift Package Manager, swift build, swift test, optional swift-format.
stack:
  language: [swift]
  runsOn: [app-store]
  basic: true
defaults:
  modules: { devenv: false, ui-design: false, backup: false }
requires: [swift>=5.9, just]
