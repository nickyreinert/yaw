# profiles/node-web
# Picked for JavaScript/TypeScript x your own server (ADR-0054, T-001).
# Profile options (framework, db; doc 05 §2) come with the full interview; the scaffold is plain TypeScript on node:http without a database.
name: node-web
title: TypeScript web app on your own server
dependencyEcosystems: [npm]
summary: TypeScript web app on node:http for your own server; tsc, ESLint, Vitest, npm audit, Dockerfile.
stack:
  language: [typescript]
  runsOn: [self-hosted]
defaults:
  modules: { devenv: true, ui-design: false, backup: false }
requires: [node>=22.13, just]
# Warning lines a passing step still shows with the compact module: npm and Node warnings, eslint/stylelint/html-validate warning rows, missing-tool notes.
compact:
  warnings: '^npm (warn|WARN) |^\(node:\d+\) \w*Warning: |^\s+\d+:\d+\s+(warning|⚠)\s|^[a-z-]+: .* is not installed'
